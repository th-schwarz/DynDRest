# .github/release.yml
changelog:
  # Define the categories for the release notes
  categories:
    - title: "🐛 Bugs"
      labels:
        - bug
        - fix
    - title: "✨ Improvements"
      labels:
        - improvement
        - refactor
    - title: "🌟 Enhancements"
      labels:
        - enhancement
        - feature

  # Fallback configuration for uncategorized items
  # If an issue or PR doesn't match a category, it will be included here
  uncategorized:
    title: "🔍 Uncategorized"

  # Optional: Exclude certain labels (e.g., documentation, tests) from the changelog
  exclude_labels:
    - documentation
    - test
