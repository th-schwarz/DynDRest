name: Build and Analyse

on:
  push:
    branches:
      - develop
      - feature*
  pull_request:
    types: [ opened, synchronize, reopened ]

defaults:
  run:
    shell: bash

jobs:

  mvn-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Set up Maven with GitHub Packages
        run: |
          echo "<settings>
          <servers>
          <server>
          <id>github-cloudflaredns</id>
          <username>th-schwarz</username>
          <password>${{ secrets.GITHUB_TOKEN }}</password>
          </server>
          </servers>
          </settings>" > ~/.m2/settings.xml
      - name: Cache maven repository
        uses: actions/cache@v4.2.0
        with:
          path: ~/.m2/repository
          key: maven
          restore-keys: maven
      - name: Build with Maven
        env:
          DOMAINROBOT_USER: ${{ secrets.DOMAINROBOT_USER }}
          DOMAINROBOT_PASSWORD: ${{ secrets.DOMAINROBOT_PASSWORD }}
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: mvn -DtestClasspath=src/test/ verify

  sonarcloud-scan:
    needs: mvn-build
    name: Build and analyze with sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Set up Maven with GitHub Packages
        run: |
          echo "<settings>
          <servers>
          <server>
          <id>github-cloudflaredns</id>
          <username>th-schwarz</username>
          <password>${{ secrets.GITHUB_TOKEN }}</password>
          </server>
          </servers>
          </settings>" > ~/.m2/settings.xml
      - name: Cache maven repository
        uses: actions/cache@v4.2.0
        with:
          path: ~/.m2/repository
          key: maven
          restore-keys: maven
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DOMAINROBOT_USER: ${{ secrets.DOMAINROBOT_USER }}
          DOMAINROBOT_PASSWORD: ${{ secrets.DOMAINROBOT_PASSWORD }}
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=th-schwarz_DynDRest
